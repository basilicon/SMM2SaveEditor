name: Build and Release

on:
  push:
    branches: [ publish ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target.os }})
    runs-on: ${{ matrix.target.runs-on }}
    strategy:
      matrix:
        target:
          - os: Windows-x64
            rid: win-x64
            runs-on: windows-latest
            archive: SMM2SaveEditor-win-x64.zip
          - os: Linux-x64
            rid: linux-x64
            runs-on: ubuntu-latest
            archive: SMM2SaveEditor-linux-x64.tar.gz
          - os: macOS-arm64
            rid: osx-arm64
            runs-on: macos-latest
            archive: SMM2SaveEditor-osx-arm64.tar.gz
          - os: macOS-x64
            rid: osx-x64
            runs-on: macos-13
            archive: SMM2SaveEditor-osx-x64.tar.gz

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore SMM2SaveEditor.csproj

      - name: Publish Standalone Binary
        run: >
          dotnet publish SMM2SaveEditor.csproj
          -c Release
          -r ${{ matrix.target.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish/${{ matrix.target.rid }}

      - name: Archive Output (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/${{ matrix.target.rid }}/* -DestinationPath ./${{ matrix.target.archive }}

      - name: Archive Output (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czvf ./${{ matrix.target.archive }} -C ./publish/${{ matrix.target.rid }} .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.os }}
          path: ./${{ matrix.target.archive }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/publish'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-publish' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Publish Build' }}
          files: ./${{ matrix.target.archive }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
